; Root-level pytest config so `pytest` works from the repo root, not only from
; app/. Without this, a bare `pytest` here walks into _archive/ and dies during
; collection on a stale `import config` — a confusing failure that looks like
; the test suite is broken when it is in fact fine.
;
; app/pytest.ini still governs runs started inside app/ (CI and preflight.sh
; both cd there first); pytest picks the nearest config, so the two coexist.
[pytest]
testpaths = app/tests
pythonpath = app
norecursedirs = _archive .git .venv venv node_modules __pycache__ app/instance
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
